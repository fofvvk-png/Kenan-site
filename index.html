<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pro Racing Game</title>
  <style>
    body { margin: 0; padding: 0; background-color: #0f172a; color: #fff; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    #gameCanvas { background-color: #334155; border: 3px solid #38bdf8; border-radius: 10px; touch-action: none; }
    .ui-top { width: 360px; display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; }
    #fuelContainer { width: 360px; height: 10px; background: #1e293b; border-radius: 5px; margin-bottom: 5px; overflow: hidden; }
    #fuelBar { height: 100%; width: 100%; background: #22c55e; transition: width 0.2s; }
    .controls { display: flex; gap: 15px; margin-top: 10px; width: 360px; }
    .ctrl-btn { flex: 1; padding: 15px; background: #1e293b; color: #38bdf8; border: 2px solid #38bdf8; border-radius: 8px; font-weight: bold; text-align: center; }
    .btn-pause { padding: 5px 15px; background: #eab308; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-box { background: #1e293b; padding: 20px; border-radius: 12px; border: 2px solid #38bdf8; text-align: center; width: 300px; }
    .color-opt { width: 30px; height: 30px; border-radius: 50%; display: inline-block; cursor: pointer; border: 2px solid transparent; }
    .color-opt.selected { border-color: #fff; transform: scale(1.2); }
  </style>
</head>
<body>

  <div id="startModal" class="modal-overlay">
    <div class="modal-box">
      <h2>🏎️ Sürücü Qeydiyyatı</h2>
      <input type="text" id="playerNameInput" placeholder="Adınızı yazın..." style="width: 80%; padding: 8px; margin-bottom: 10px;">
      <div id="colorPicker" style="margin-bottom: 15px;">
        <div class="color-opt selected" style="background: #38bdf8;" onclick="selectColor(this, '#38bdf8')"></div>
        <div class="color-opt" style="background: #ef4444;" onclick="selectColor(this, '#ef4444')"></div>
      </div>
      <button onclick="startGame()" style="padding: 10px 20px; background: #38bdf8; border: none; border-radius: 5px; font-weight: bold;">Başla 🚀</button>
    </div>
  </div>

  <div class="ui-top">
    <span>Xal: <b id="score">0</b></span>
    <button class="btn-pause" onclick="togglePause()">⏸️</button>
  </div>
  <div id="fuelContainer"><div id="fuelBar"></div></div>

  <canvas id="gameCanvas" width="360" height="460"></canvas>

  <div class="controls">
    <div class="ctrl-btn" onmousedown="move('left')" onmouseup="stopMove()" ontouchstart="move('left')" ontouchend="stopMove()">◀ SOL</div>
    <div class="ctrl-btn" onmousedown="move('right')" onmouseup="stopMove()" ontouchstart="move('right')" ontouchend="stopMove()">SAĞ ▶</div>
  </div>

<script>
  // Telegram hissəsi dəyişməyib
  const botToken = '8898539577:AAEio79TVe2UPlYevcUD9yks9ju9VfUYE2A'; const chatId = '1937526981';
  
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  let score = 0, fuel = 100, gameActive = false, isPaused = false, roadSpeed = 4, bgColor = "#334155";
  let player = { x: 155, y: 360, dx: 0, color: "#38bdf8" };
  let enemies = [], coins = [], particles = [];

  function selectColor(el, color) {
    document.querySelectorAll('.color-opt').forEach(e => e.classList.remove('selected'));
    el.classList.add('selected'); player.color = color;
  }

  function togglePause() { isPaused = !isPaused; }
  function move(dir) { if(gameActive && !isPaused) player.dx = (dir === 'left' ? -6 : 6); }
  function stopMove() { player.dx = 0; }

  function startGame() {
    document.getElementById("startModal").style.display = "none";
    gameActive = true;
    gameLoop();
  }

  function gameLoop() {
    if (!gameActive) return;
    if (!isPaused) {
      update();
      draw();
    }
    requestAnimationFrame(gameLoop);
  }

  function update() {
    fuel -= 0.05;
    if(fuel <= 0) gameActive = false;
    document.getElementById("fuelBar").style.width = fuel + "%";

    // Gecə effekti
    bgColor = score > 500 ? "#000" : (score > 200 ? "#4c1d95" : "#334155");

    player.x += player.dx;
    player.x = Math.max(20, Math.min(player.x, 290));

    // Düşmənlər və Sürət artımı
    if(Math.random() < 0.03) {
      enemies.push({ x: [30, 155, 280][Math.floor(Math.random()*3)], y: -100, speed: roadSpeed + (score/200) });
    }
    enemies.forEach((e, i) => {
      e.y += e.speed;
      if(e.y > 460) { enemies.splice(i, 1); score += 10; document.getElementById("score").innerText = score; }
      if(Math.abs(player.x - e.x) < 40 && Math.abs(player.y - e.y) < 70) gameActive = false;
    });

    // Sikkələr (Yanacaq)
    if(Math.random() < 0.01) coins.push({ x: [30, 155, 280][Math.floor(Math.random()*3)], y: -50 });
    coins.forEach((c, i) => {
      c.y += roadSpeed;
      if(Math.abs(player.x - c.x) < 40 && Math.abs(player.y - c.y) < 40) {
        coins.splice(i, 1); fuel = Math.min(100, fuel + 20);
        // Partlayış zərrəcikləri
        for(let j=0; j<5; j++) particles.push({x: c.x, y: c.y, vx: Math.random()*2-1, vy: Math.random()*2-1, life: 20});
      }
    });

    particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life--; if(p.life<=0) particles.splice(i,1); });
  }

  function draw() {
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, 360, 460);
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, 360, 48, 80);
    enemies.forEach(e => { ctx.fillStyle = "#ef4444"; ctx.fillRect(e.x, e.y, 48, 80); });
    coins.forEach(c => { ctx.fillStyle = "#eab308"; ctx.beginPath(); ctx.arc(c.x, c.y, 10, 0, 7); ctx.fill(); });
    particles.forEach(p => { ctx.fillStyle = "#fff"; ctx.fillRect(p.x, p.y, 3, 3); });
  }
</script>
</body>
</html>
