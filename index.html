<!DOCTYPE html>
<html lang="az">
<head>
  <!-- Brauzer panelini gizlətmək və tam ekran etmək üçün -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Müasir 2D Avtomobil Yarışı (Multiplayer)</title>

  <!-- Socket.io Kitabxanası -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- CSS FAYLI BAĞLANIR -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Telefon Dik Tutulduqda Görünən Ekran -->
  <div id="rotateWarning">
    <div style="font-size: 50px; margin-bottom: 15px;">🔄</div>
    <b>Daha yaxşı oyun təcrübəsi üçün<br>telefonu yana (üfüqi) çevirin!</b>
  </div>

  <!-- Ad və Rəng Seçimi Pəncərəsi -->
  <div id="startModal" class="modal-overlay">
    <div class="modal-box">
      <h2>🏎️ Multiplayer Yarış</h2>
      <p style="margin-bottom: 5px; font-size: 14px;">Adınızı girin:</p>
      <input type="text" id="playerNameInput" placeholder="Adınızı yazın..." maxlength="15">
      
      <p style="margin-bottom: 8px; font-size: 14px;">Maşınınızın Rəngini Seçin:</p>
      <div class="color-picker">
        <div class="color-opt selected" style="background: #38bdf8;" onclick="selectColor(this, '#38bdf8')"></div>
        <div class="color-opt" style="background: #ef4444;" onclick="selectColor(this, '#ef4444')"></div>
        <div class="color-opt" style="background: #22c55e;" onclick="selectColor(this, '#22c55e')"></div>
        <div class="color-opt" style="background: #eab308;" onclick="selectColor(this, '#eab308')"></div>
        <div class="color-opt" style="background: #a855f7;" onclick="selectColor(this, '#a855f7')"></div>
        <div class="color-opt" style="background: #f97316;" onclick="selectColor(this, '#f97316')"></div>
      </div>
      
      <button class="btn-start" onclick="startGameWithPlayer(); openFullscreen()">Otağa Qoşul 🚀</button>
      <div id="statusText"></div>
    </div>
  </div>

  <div class="game-container">
    <h1>🏎️ 2D Avtomobil Yarışı</h1>
    <div class="info">
      Siz: <b id="driverName" style="color: #38bdf8;">-</b> | 
      Rəqib: <b id="opponentName" style="color: #ef4444;">Gözlənilir...</b><br>
      Xal: <span id="score">0</span> | Rekord: <span id="highScore" style="color: #eab308;">0</span>
    </div>

    <canvas id="gameCanvas" width="500" height="320"></canvas>

    <div class="controls">
      <div class="ctrl-btn" id="leftBtn">◀ SOL</div>
      <div class="ctrl-btn" id="rightBtn">SAĞ ▶</div>
    </div>

    <button id="restartBtn" class="btn-restart" onclick="restartGame()">Yenidən Başla 🔄</button>
  </div>

  <!-- JAVASCRIPT FAYLI BAĞLANIR -->
  <script src="script.js"></script>
</body>
</html>
