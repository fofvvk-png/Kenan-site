<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoAssistant - Kalkulyator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h2>🚗 AutoAssistant</h2>
    <p class="subtitle">Yanacaq və Texniki Qulluq Hesablayıcısı</p>

    <form id="autoForm">
      <div class="input-group">
        <label>🚘 Avtomobil Modeli:</label>
        <input type="text" id="model" placeholder="məs: Chevrolet Cruze, Kia Optima" required>
      </div>

      <div class="input-group">
        <label>🛣️ Qət edilən məsafə (km):</label>
        <input type="number" id="distance" placeholder="məs: 450" required>
      </div>

      <div class="input-group">
        <label>⛽ İşlədilən yanacaq (Litr):</label>
        <input type="number" step="0.1" id="fuel" placeholder="məs: 40" required>
      </div>

      <div class="input-group">
        <label>💰 Yanacağın litr qiyməti (AZN):</label>
        <input type="number" step="0.01" id="price" value="1.10" required>
      </div>

      <div class="input-group">
        <label>🔧 Cari Yürüş (Probeq - km):</label>
        <input type="number" id="mileage" placeholder="məs: 185000" required>
      </div>

      <button type="button" onclick="calculate()">📊 Hesabla və Şəxsi Hesabat Yarat</button>
    </form>

    <div id="result" class="result-box" style="display: none;">
      <h3>📋 Hesabat Nəticələri:</h3>
      <p id="resFuel"></p>
      <p id="resCost"></p>
      <p id="resOil"></p>

      <button class="tg-btn" onclick="sendToTelegram()">📩 Hesabatı Telegram-a Göndər</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
