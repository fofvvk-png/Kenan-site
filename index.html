<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Müasir 2D Avtomobil Yarışı</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    h1 {
      margin: 5px 0;
      font-size: 20px;
      color: #38bdf8;
    }

    .info {
      margin-bottom: 8px;
      font-size: 15px;
    }

    #gameCanvas {
      background-color: #334155;
      border: 3px solid #38bdf8;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      touch-action: none;
    }

    /* İdarəetmə Düymələri */
    .controls {
      display: flex;
      gap: 15px;
      margin-top: 10px;
      width: 360px;
      justify-content: space-between;
    }

    .ctrl-btn {
      flex: 1;
      padding: 15px 0;
      font-size: 20px;
      font-weight: bold;
      background: #1e293b;
      color: #38bdf8;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .ctrl-btn:active {
      background: #38bdf8;
      color: #0f172a;
    }

    /* Modal / Başlanğıc Pəncərəsi */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-box {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #38bdf8;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      max-width: 320px;
      width: 90%;
    }

    .modal-box h2 {
      margin-top: 0;
      color: #38bdf8;
    }

    .modal-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0 15px;
      border-radius: 6px;
      border: 1px solid #38bdf8;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    .color-picker {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .color-opt {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s;
    }

    .color-opt.selected {
      border-color: #fff;
      transform: scale(1.2);
    }

    .btn-start {
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }

    .btn-restart {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Ad və Rəng Seçimi Pəncərəsi -->
  <div id="startModal" class="modal-overlay">
    <div class="modal-box">
      <h2>🏎️ Sürücü Qeydiyyatı</h2>
      <p style="margin-bottom: 5px; font-size: 14px;">Adınızı girin:</p>
      <input type="text" id="playerNameInput" placeholder="Adınızı yazın..." maxlength="15">
      
      <p style="margin-bottom: 8px; font-size: 14px;">Maşınınızın Rəngini Seçin:</p>
      <div class="color-picker">
        <div class="color-opt selected" style="background: #38bdf8;" onclick="selectColor(this, '#38bdf8')"></div>
        <div class="color-opt" style="background: #ef4444;" onclick="selectColor(this, '#ef4444')"></div>
        <div class="color-opt" style="background: #22c55e;" onclick="selectColor(this, '#22c55e')"></div>
        <div class="color-opt" style="background: #eab308;" onclick="selectColor(this, '#eab308')"></div>
        <div class="color-opt" style="background: #a855f7;" onclick="selectColor(this, '#a855f7')"></div>
        <div class="color-opt" style="background: #f97316;" onclick="selectColor(this, '#f97316')"></div>
      </div>

      <button class="btn-start" onclick="startGameWithPlayer()">Yarışa Başla 🚀</button>
    </div>
  </div>

  <h1>🏎️ 2D Avtomobil Yarışı</h1>
  <div class="info">Sürücü: <b id="driverName" style="color: #38bdf8;">-</b> | Xal: <span id="score">0</span> | Rekord: <span id="highScore" style="color: #eab308;">0</span></div>

  <canvas id="gameCanvas" width="360" height="460"></canvas>

  <div class="controls">
    <div class="ctrl-btn" id="leftBtn">◀ SOL</div>
    <div class="ctrl-btn" id="rightBtn">SAĞ ▶</div>
  </div>

  <button id="restartBtn" class="btn-restart" onclick="restartGame()">Yenidən Başla 🔄</button>

  <script>
    // --- TELEGRAM MƏLUMATLARIN ---
    const botToken = '8898539577:AAEio79TVe2UPlYevcUD9yks9ju9VfUYE2A'; 
    const chatId = '1937526981';     

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const highScoreElement = document.getElementById("highScore");
    const restartBtn = document.getElementById("restartBtn");

    let playerName = "";
    let selectedCarColor = "#38bdf8";
    let gameStarted = false;
    let highScore = localStorage.getItem("carGameHighScore") || 0;
    highScoreElement.innerText = highScore;

    function selectColor(element, color) {
      document.querySelectorAll('.color-opt').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');
      selectedCarColor = color;
    }

    function sendTelegramMessage(msgText) {
      if (!botToken || !chatId || botToken.includes('BURAYA_YAZ')) return;
      const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(msgText)}&parse_mode=Markdown`;
      const img = new Image();
      img.src = url;
    }

    // --- SƏS SİSTEMİ ---
    let audioCtx = null;
    let engineOsc = null;
    let engineGain = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        engineOsc = audioCtx.createOscillator();
        engineGain = audioCtx.createGain();

        engineOsc.type = 'sawtooth';
        engineOsc.frequency.setValueAtTime(60, audioCtx.currentTime);
        engineGain.gain.setValueAtTime(0.04, audioCtx.currentTime);

        engineOsc.connect(engineGain);
        engineGain.connect(audioCtx.destination);
        engineOsc.start();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playCrashSound() {
      if (!audioCtx) return;
      const bufferSize = audioCtx.sampleRate * 0.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

      noise.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    function playCoinSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function stopEngineSound() {
      if (engineGain && audioCtx) {
        engineGain.gain.setValueAtTime(0, audioCtx.currentTime);
      }
    }

    function updateEnginePitch(speed) {
      if (engineOsc && audioCtx) {
        const freq = 50 + (speed * 12);
        engineOsc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      }
    }

    function startGameWithPlayer() {
      const input = document.getElementById("playerNameInput");
      const name = input.value.trim();

      if (!name) {
        alert("Zəhmət olmasa adınızı yazın!");
        return;
      }

      playerName = name;
      document.getElementById("driverName").innerText = playerName;
      document.getElementById("startModal").style.display = "none";

      initAudio();
      gameStarted = true;

      const startMsg = `👤 YENİ SÜRÜCÜ OYUNA BAŞLADI!\n\n📛 Sürücü Adı: ${playerName}\n📅 Tarix: ${new Date().toLocaleString('az-AZ')}`;
      sendTelegramMessage(startMsg);

      gameLoop();
    }

    // Oyun parametrləri
    let score = 0;
    let gameOver = false;
    let baseRoadSpeed = 4;
    let roadSpeed = 4;
    let lineOffset = 0;

    let isNitroActive = false;
    let nitroTimer = 0;

    const player = {
      x: 155,
      y: 360,
      width: 48,
      height: 80,
      speed: 6,
      dx: 0
    };

    let enemies = [];
    let coins = [];
    let nitros = [];

    // İdarəetmə
    document.addEventListener("keydown", (e) => {
      if (!gameStarted) return;
      if (e.key === "ArrowLeft" || e.key === "a") player.dx = -player.speed;
      if (e.key === "ArrowRight" || e.key === "d") player.dx = player.speed;
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "ArrowRight" || e.key === "d") {
        player.dx = 0;
      }
    });

    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");

    const startLeft = (e) => { e.preventDefault(); if (gameStarted) player.dx = -player.speed; };
    const startRight = (e) => { e.preventDefault(); if (gameStarted) player.dx = player.speed; };
    const stopMove = (e) => { e.preventDefault(); player.dx = 0; };

    leftBtn.addEventListener("touchstart", startLeft);
    leftBtn.addEventListener("touchend", stopMove);
    leftBtn.addEventListener("mousedown", startLeft);
    leftBtn.addEventListener("mouseup", stopMove);

    rightBtn.addEventListener("touchstart", startRight);
    rightBtn.addEventListener("touchend", stopMove);
    rightBtn.addEventListener("mouseup", stopMove);

    function spawnEnemy() {
      const lanes = [30, 155, 280];
      const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
      const colors = ["#ef4444", "#22c55e", "#eab308", "#a855f7", "#ec4899"];
      enemies.push({
        x: randomLane,
        y: -100,
        width: 48,
        height: 80,
        color: colors[Math.floor(Math.random() * colors.length)],
        speed: roadSpeed + Math.random() * 2
      });
    }

    function spawnCoin() {
      const lanes = [40, 165, 290];
      coins.push({
        x: lanes[Math.floor(Math.random() * lanes.length)],
        y: -50,
        radius: 12
      });
    }

    function spawnNitro() {
      const lanes = [40, 165, 290];
      nitros.push({
        x: lanes[Math.floor(Math.random() * lanes.length)],
        y: -50,
        size: 24
      });
    }

    function drawModernCar(x, y, width, height, color, isPlayer = false) {
      // Nitro Alov Efekti
      if (isPlayer && isNitroActive) {
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.moveTo(x + 15, y + height);
        ctx.lineTo(x + width / 2, y + height + 25 + Math.random() * 10);
        ctx.lineTo(x + width - 15, y + height);
        ctx.fill();

        ctx.fillStyle = "#eab308";
        ctx.beginPath();
        ctx.moveTo(x + 18, y + height);
        ctx.lineTo(x + width / 2, y + height + 15);
        ctx.lineTo(x + width - 18, y + height);
        ctx.fill();
      }

      // Təkərlər
      ctx.fillStyle = "#000000";
      ctx.fillRect(x - 3, y + 10, 5, 18);
      ctx.fillRect(x + width - 2, y + 10, 5, 18);
      ctx.fillRect(x - 3, y + height - 28, 5, 18);
      ctx.fillRect(x + width - 2, y + height - 28, 5, 18);

      // Gövdə
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, 12);
      ctx.fill();

      // Şüşələr
      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.roundRect(x + 5, isPlayer ? y + 22 : y + 42, width - 10, 16, 4);
      ctx.fill();
      
      ctx.beginPath();
      ctx.roundRect(x + 7, isPlayer ? y + 52 : y + 14, width - 14, 10, 3);
      ctx.fill();

      // Spoyler
      ctx.fillStyle = "#000000";
      const spoilerY = isPlayer ? y + height - 5 : y + 2;
      ctx.fillRect(x + 4, spoilerY, width - 8, 4);

      // İşıqlar
      if (isPlayer) {
        ctx.fillStyle = "#fef08a";
        ctx.fillRect(x + 4, y + 2, 10, 4);
        ctx.fillRect(x + width - 14, y + 2, 10, 4);
        ctx.fillStyle = "#dc2626";
        ctx.fillRect(x + 5, y + height - 3, 8, 3);
        ctx.fillRect(x + width - 13, y + height - 3, 8, 3);
      } else {
        ctx.fillStyle = "#fef08a";
        ctx.fillRect(x + 4, y + height - 6, 10, 4);
        ctx.fillRect(x + width - 14, y + height - 6, 10, 4);
        ctx.fillStyle = "#dc2626";
        ctx.fillRect(x + 5, y + 2, 8, 3);
        ctx.fillRect(x + width - 13, y + 2, 8, 3);
      }
    }

    function drawRoad() {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#15803d";
      ctx.fillRect(0, 0, 15, canvas.height);
      ctx.fillRect(canvas.width - 15, 0, 15, canvas.height);

      ctx.strokeStyle = isNitroActive ? "#38bdf8" : "#ffffff";
      ctx.lineWidth = 4;
      ctx.setLineDash([20, 20]);
      ctx.lineDashOffset = -lineOffset;

      ctx.beginPath();
      ctx.moveTo(120, 0);
      ctx.lineTo(120, canvas.height);
      ctx.moveTo(240, 0);
      ctx.lineTo(240, canvas.height);
      ctx.stroke();

      ctx.setLineDash([]);
    }

    function update() {
      if (gameOver || !gameStarted) return;

      // Nitro idarəetməsi
      if (isNitroActive) {
        roadSpeed = baseRoadSpeed * 2;
        nitroTimer--;
        if (nitroTimer <= 0) {
          isNitroActive = false;
        }
      } else {
        roadSpeed = baseRoadSpeed;
      }

      lineOffset += roadSpeed;
      if (lineOffset > 40) lineOffset = 0;

      player.x += player.dx;
      if (player.x < 18) player.x = 18;
      if (player.x + player.width > canvas.width - 18) {
        player.x = canvas.width - 18 - player.width;
      }

      updateEnginePitch(roadSpeed);

      // Düşmənlər
      for (let i = 0; i < enemies.length; i++) {
        let e = enemies[i];
        e.y += e.speed;

        if (
          player.x < e.x + e.width &&
          player.x + player.width > e.x &&
          player.y < e.y + e.height &&
          player.y + player.height > e.y
        ) {
          endGame();
        }

        if (e.y > canvas.height) {
          enemies.splice(i, 1);
          score += isNitroActive ? 20 : 10;
          scoreElement.innerText = score;
          i--;

          if (score % 60 === 0) baseRoadSpeed += 0.4;
        }
      }

      // Qızıllar
      for (let i = 0; i < coins.length; i++) {
        let c = coins[i];
        c.y += roadSpeed;

        if (
          player.x < c.x + c.radius &&
          player.x + player.width > c.x - c.radius &&
          player.y < c.y + c.radius &&
          player.y + player.height > c.y - c.radius
        ) {
          coins.splice(i, 1);
          score += 20;
          scoreElement.innerText = score;
          playCoinSound();
          i--;
          continue;
        }

        if (c.y > canvas.height) {
          coins.splice(i, 1);
          i--;
        }
      }

      // Nitrolar
      for (let i = 0; i < nitros.length; i++) {
        let n = nitros[i];
        n.y += roadSpeed;

        if (
          player.x < n.x + n.size &&
          player.x + player.width > n.x &&
          player.y < n.y + n.size &&
          player.y + player.height > n.y
        ) {
          nitros.splice(i, 1);
          isNitroActive = true;
          nitroTimer = 180; // ~3 saniyə
          i--;
          continue;
        }

        if (n.y > canvas.height) {
          nitros.splice(i, 1);
          i--;
        }
      }

      // Təsadüfi çıxışlar
      if (Math.random() < 0.02 && (enemies.length === 0 || enemies[enemies.length - 1].y > 140)) {
        spawnEnemy();
      }
      if (Math.random() < 0.008) spawnCoin();
      if (Math.random() < 0.003) spawnNitro();
    }

    function draw() {
      drawRoad();

      // Qızılları çək
      coins.forEach(c => {
        ctx.fillStyle = "#eab308";
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // Nitroları çək
      nitros.forEach(n => {
        ctx.fillStyle = "#38bdf8";
        ctx.font = "20px Arial";
        ctx.fillText("⚡", n.x, n.y);
      });

      // Player və düşmən maşınlar
      drawModernCar(player.x, player.y, player.width, player.height, selectedCarColor, true);
      enemies.forEach(e => drawModernCar(e.x, e.y, e.width, e.height, e.color, false));

      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ef4444";
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "center";
        ctx.fillText("OYUN BİTDİ!", canvas.width / 2, 180);

        ctx.fillStyle = "#ffffff";
        ctx.font = "18px Arial";
        ctx.fillText(`Sürücü: ${playerName}`, canvas.width / 2, 220);
        ctx.fillText(`Topladığın Xal: ${score}`, canvas.width / 2, 250);
      }
    }

    function gameLoop() {
      update();
      draw();
      if (!gameOver && gameStarted) requestAnimationFrame(gameLoop);
    }

    function endGame() {
      gameOver = true;
      playCrashSound();
      stopEngineSound();
      restartBtn.style.display = "block";

      let isNewRecord = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("carGameHighScore", highScore);
        highScoreElement.innerText = highScore;
        isNewRecord = true;
      }

      let endMsg = `🏁 OYUN BİTDİ!\n\n👤 Sürücü: ${playerName}\n🏆 Xal: ${score}`;
      if (isNewRecord) {
        endMsg = `🏆 YENİ REKORD QIRILDI!\n\n👤 Sürücü: ${playerName}\n🎯 Yeni Rekord Xal: ${score}`;
      }

      sendTelegramMessage(endMsg);
    }

    function restartGame() {
      score = 0;
      baseRoadSpeed = 4;
      roadSpeed = 4;
      enemies = [];
      coins = [];
      nitros = [];
      isNitroActive = false;
      player.x = 155;
      gameOver = false;
      scoreElement.innerText = score;
      restartBtn.style.display = "none";

      if (engineGain && audioCtx) {
        engineGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      }

      gameLoop();
    }
  </script>
</body>
</html>
