<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Avtomobil Yarışı</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    h1 {
      margin: 10px 0 5px;
      color: #38bdf8;
    }

    .info {
      margin-bottom: 10px;
      font-size: 18px;
    }

    #gameCanvas {
      background-color: #334155;
      border: 4px solid #38bdf8;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Ad Daxil Etmə Pəncərəsi (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-box {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      border: 2px solid #38bdf8;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      max-width: 300px;
      width: 80%;
    }

    .modal-box h2 {
      margin-top: 0;
      color: #38bdf8;
    }

    .modal-box input {
      width: 90%;
      padding: 10px;
      margin: 15px 0;
      border-radius: 6px;
      border: 1px solid #38bdf8;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    .btn-start {
      padding: 10px 25px;
      font-size: 16px;
      font-weight: bold;
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }

    .btn-start:hover {
      background-color: #0284c7;
      color: #fff;
    }

    .btn-restart {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Ad Tələb Olunan Giriş Pəncərəsi -->
  <div id="startModal" class="modal-overlay">
    <div class="modal-box">
      <h2>🏎️ Sürücü Adı</h2>
      <p>Oyuna başlamaq üçün adınızı daxil edin:</p>
      <input type="text" id="playerNameInput" placeholder="Adınızı yazın..." maxlength="20">
      <button class="btn-start" onclick="startGameWithPlayer()">Oyuna Başla 🚀</button>
    </div>
  </div>

  <h1>🏎️ 2D Avtomobil Yarışı</h1>
  <div class="info">Sürücü: <b id="driverName" style="color: #38bdf8;">-</b> | Xal: <span id="score">0</span></div>

  <canvas id="gameCanvas" width="360" height="500"></canvas>
  <button id="restartBtn" class="btn-restart" onclick="restartGame()">Yenidən Başla 🔄</button>

  <script>
    const botToken = '8898539577:AAEio79TVe2UPlYevcUD9yks9ju9VfUYE2A';
    const chatId = '1937526981';

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const restartBtn = document.getElementById("restartBtn");

    let playerName = "";
    let gameStarted = false;

    // --- SƏS SİSTEMİ ---
    let audioCtx = null;
    let engineOsc = null;
    let engineGain = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        engineOsc = audioCtx.createOscillator();
        engineGain = audioCtx.createGain();

        engineOsc.type = 'sawtooth';
        engineOsc.frequency.setValueAtTime(60, audioCtx.currentTime);
        engineGain.gain.setValueAtTime(0.05, audioCtx.currentTime);

        engineOsc.connect(engineGain);
        engineGain.connect(audioCtx.destination);
        engineOsc.start();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playCrashSound() {
      if (!audioCtx) return;
      const bufferSize = audioCtx.sampleRate * 0.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

      noise.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    function stopEngineSound() {
      if (engineGain) {
        engineGain.gain.setValueAtTime(0, audioCtx.currentTime);
      }
    }

    function updateEnginePitch(speed) {
      if (engineOsc && audioCtx) {
        const freq = 50 + (speed * 12);
        engineOsc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      }
    }

    // --- OYUNA BAŞLAMA VƏ TELEGRAMA GÖNDƏRMƏ ---
    async function startGameWithPlayer() {
      const input = document.getElementById("playerNameInput");
      const name = input.value.trim();

      if (!name) {
        alert("Zəhmət olmasa adınızı yazın!");
        return;
      }

      playerName = name;
      document.getElementById("driverName").innerText = playerName;
      document.getElementById("startModal").style.display = "none";

      initAudio();
      gameStarted = true;

      // Telegram-a Sürücü Məlumatını Göndər
      try {
        const message = `👤 *YENİ SÜRÜCÜ OYUNA BAŞLADI!*\n\n` +
                        `📛 *Sürücü Adı:* \`${playerName}\`\n` +
                        `📅 *Tarix:* ${new Date().toLocaleString('az-AZ')}`;

        fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: 'Markdown' })
        });
      } catch (e) {
        console.error("Telegram göndərişində xəta:", e);
      }

      gameLoop();
    }

    // Oyun dəyişənləri
    let score = 0;
    let gameOver = false;
    let roadSpeed = 4;
    let lineOffset = 0;

    const player = {
      x: 155,
      y: 400,
      width: 50,
      height: 80,
      speed: 6,
      dx: 0
    };

    let enemies = [];

    // İdarəetmə
    document.addEventListener("keydown", (e) => {
      if (!gameStarted) return;
      if (e.key === "ArrowLeft" || e.key === "a") player.dx = -player.speed;
      if (e.key === "ArrowRight" || e.key === "d") player.dx = player.speed;
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "ArrowRight" || e.key === "d") {
        player.dx = 0;
      }
    });

    canvas.addEventListener("touchstart", (e) => {
      if (!gameStarted) return;
      const touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
      if (touchX < canvas.width / 2) player.dx = -player.speed;
      else player.dx = player.speed;
    });

    canvas.addEventListener("touchend", () => player.dx = 0);

    function spawnEnemy() {
      const lanes = [30, 155, 280];
      const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
      const colors = ["#e11d48", "#22c55e", "#eab308", "#a855f7"];
      const randomColor = colors[Math.floor(Math.random() * colors.length)];

      enemies.push({
        x: randomLane,
        y: -100,
        width: 50,
        height: 80,
        color: randomColor,
        speed: roadSpeed + Math.random() * 2
      });
    }

    function drawCar(x, y, width, height, color, isPlayer = false) {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(x - 4, y + 10, 6, 18);
      ctx.fillRect(x + width - 2, y + 10, 6, 18);
      ctx.fillRect(x - 4, y + height - 28, 6, 18);
      ctx.fillRect(x + width - 2, y + height - 28, 6, 18);

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, 10);
      ctx.fill();

      ctx.fillStyle = "#0f172a";
      ctx.fillRect(x + 6, isPlayer ? y + 20 : y + 45, width - 12, 18);

      ctx.fillStyle = isPlayer ? "#fef08a" : "#ef4444";
      const lightY = isPlayer ? y + 4 : y + height - 8;
      ctx.fillRect(x + 6, lightY, 10, 4);
      ctx.fillRect(x + width - 16, lightY, 10, 4);
    }

    function drawRoad() {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#15803d";
      ctx.fillRect(0, 0, 15, canvas.height);
      ctx.fillRect(canvas.width - 15, 0, 15, canvas.height);

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 4;
      ctx.setLineDash([20, 20]);
      ctx.lineDashOffset = -lineOffset;

      ctx.beginPath();
      ctx.moveTo(120, 0);
      ctx.lineTo(120, canvas.height);
      ctx.moveTo(240, 0);
      ctx.lineTo(240, canvas.height);
      ctx.stroke();

      ctx.setLineDash([]);
    }

    function update() {
      if (gameOver || !gameStarted) return;

      lineOffset += roadSpeed;
      if (lineOffset > 40) lineOffset = 0;

      player.x += player.dx;

      if (player.x < 18) player.x = 18;
      if (player.x + player.width > canvas.width - 18) {
        player.x = canvas.width - 18 - player.width;
      }

      updateEnginePitch(roadSpeed);

      for (let i = 0; i < enemies.length; i++) {
        let e = enemies[i];
        e.y += e.speed;

        if (
          player.x < e.x + e.width &&
          player.x + player.width > e.x &&
          player.y < e.y + e.height &&
          player.y + player.height > e.y
        ) {
          endGame();
        }

        if (e.y > canvas.height) {
          enemies.splice(i, 1);
          score += 10;
          scoreElement.innerText = score;
          i--;

          if (score % 50 === 0) roadSpeed += 0.5;
        }
      }

      if (Math.random() < 0.02) {
        if (enemies.length === 0 || enemies[enemies.length - 1].y > 150) {
          spawnEnemy();
        }
      }
    }

    function draw() {
      drawRoad();

      drawCar(player.x, player.y, player.width, player.height, "#0284c7", true);

      enemies.forEach(e => {
        drawCar(e.x, e.y, e.width, e.height, e.color, false);
      });

      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ef4444";
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "center";
        ctx.fillText("OYUN BİTDİ!", canvas.width / 2, 200);

        ctx.fillStyle = "#ffffff";
        ctx.font = "18px Arial";
        ctx.fillText(`Sürücü: ${playerName}`, canvas.width / 2, 240);
        ctx.fillText(`Topladığın Xal: ${score}`, canvas.width / 2, 270);
      }
    }

    function gameLoop() {
      update();
      draw();
      if (!gameOver && gameStarted) requestAnimationFrame(gameLoop);
    }

    function endGame() {
      gameOver = true;
      playCrashSound();
      stopEngineSound();
      restartBtn.style.display = "block";

      // Oyun bitəndə yığdığı xalı da Telegram-a göndər
      try {
        const endMsg = `🏁 *OYUN BİTDİ!*\n\n👤 *Sürücü:* \`${playerName}\`\n🏆 *Xal:* ${score}`;
        fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: chatId, text: endMsg, parse_mode: 'Markdown' })
        });
      } catch (e) {}
    }

    function restartGame() {
      score = 0;
      roadSpeed = 4;
      enemies = [];
      player.x = 155;
      gameOver = false;
      scoreElement.innerText = score;
      restartBtn.style.display = "none";

      if (engineGain && audioCtx) {
        engineGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      }

      gameLoop();
    }
  </script>
</body>
</html>
